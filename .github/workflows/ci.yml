name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # TODO: lint is non-blocking until the remaining errors are fixed, then make it blocking.
      # Remaining errors live only in paths excluded from the formatting cleanup:
      #   - payments/bookings/pricing/refund code is frozen while payments are on hold:
      #     src/lib/{bookings,payments,pricing,refund-policy,razorpay,money,api-auth,availability,admin-queries,amenities}*,
      #     src/components/{PayNowButton,PriceBreakdownCard}.tsx, src/routes/api/public/{bookings,payments,cron}/,
      #     src/routes/api/public/razorpay-webhook.ts, screens slot.$id, bookings, reservations, wallet,
      #     earnings, admin/transactions, admin/revenue, tests/{money,security,refund,payments,pricing,reservation-overlap}*
      #   - platform-generated files (do not edit): src/integrations/supabase/*, src/types/supabase-augment.ts,
      #     src/lib/email-templates/* and src/routes/lovable/email/* (no-explicit-any in scaffolding)
      - run: bun run lint
        continue-on-error: true
      - run: bun run typecheck
      # DB tests self-skip unless RUN_DB_TESTS and PG* are provided as repo secrets.
      - run: bun run test
      - run: bun run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # Credentialed specs skip when E2E_USER_EMAIL / E2E_USER_PASSWORD are not set.
      - run: bun run e2e
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
